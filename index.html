<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <title>Ghan Chakra - Professional HD Report</title>
    <!-- PDF Library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <style>
        body { font-family: sans-serif; padding: 10px; background: #e9ecef; }
        #app { max-width: 1000px; margin: 0 auto; background: white; padding: 20px; border-radius: 8px; }
        h2 { background: #333; color: white; padding: 10px; text-align: center; border-radius: 4px; font-size: 18px;}
        .grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-bottom: 20px; }
        .input-group label { font-weight: bold; font-size: 14px;}
        input { width: 90%; padding: 8px; margin-top: 5px; border: 1px solid #000; border-radius: 4px;}
        button { background: #28a745; color: white; padding: 12px 25px; border: none; font-size: 16px; font-weight: bold; cursor: pointer; border-radius: 4px; margin: 5px;}
        table { width: 100%; border-collapse: collapse; margin-bottom: 20px; font-size: 14px; }
        th, td { border: 2px solid #333; padding: 8px; text-align: center; }
        th { background: #007bff; color: white; }
        .report-section { display: none; }
        /* Page break fix for PDF */
        #page2 { text-align: center; padding-top: 20px; width: 100%; }
        canvas { max-width: 100%; height: auto; border: 2px solid #000; display: inline-block;}
    </style>
</head>
<body>
    <div id="app">
        <!-- Input Screen -->
        <div id="input-screen">
            <h2>1. Enter Houses Degrees (H1 to H12)</h2>
            <div class="grid" id="inputs-houses"></div>
            
            <h2>2. Enter Planets Degrees</h2>
            <div class="grid" id="inputs-planets"></div>
            
            <div style="text-align: center; margin-top: 20px;">
                <button onclick="generateReport()">🚀 Generate Full HD Report</button>
            </div>
        </div>

        <!-- Report Screen -->
        <div id="report-screen" class="report-section">
            <div style="text-align: center; margin-bottom: 15px;">
                <button onclick="downloadPDF()" style="background:#007bff;">📥 Download HD PDF</button>
                <button onclick="location.reload()" style="background:#dc3545;">🔙 Back</button>
            </div>
            
            <div id="pdf-content" style="padding: 10px; background: white;">
                
                <!-- PAGE 1: Tables -->
                <div id="page1">
                    <h2>Nakshatra & Rashi Detailed Report</h2>
                    <table id="nakshatra-table">
                        <thead>
                            <tr>
                                <th>Rashi</th>
                                <th>Nakshatra Name</th>
                                <th>Occupied By (House/Planet & Pada)</th>
                            </tr>
                        </thead>
                        <tbody></tbody>
                    </table>

                    <h2>Base Degree Details</h2>
                    <table id="basic-table">
                        <thead><tr><th>Name</th><th>Degree</th><th>Type</th><th>Pada</th></tr></thead>
                        <tbody></tbody>
                    </table>
                </div>

                <!-- PAGE 2: Chakra (PDF Page Break happens before this) -->
                <div id="page2">
                    <h2>Ghan Chakra HD Overlay</h2>
                    <canvas id="chakraCanvas" width="1600" height="1600"></canvas>
                </div>

            </div>
        </div>
    </div>

    <script>
        const planets = ['Sun', 'Moon', 'Mars', 'Mercury', 'Jupiter', 'Venus', 'Saturn', 'Rahu', 'Ketu'];
        const houses = ['H1', 'H2', 'H3', 'H4', 'H5', 'H6', 'H7', 'H8', 'H9', 'H10', 'H11', 'H12'];
        const rashiNames = ['Aries', 'Taurus', 'Gemini', 'Cancer', 'Leo', 'Virgo', 'Libra', 'Scorpio', 'Sagittarius', 'Capricorn', 'Aquarius', 'Pisces'];
        const nakshatraNames = ['Ashwini', 'Bharani', 'Krittika', 'Rohini', 'Mrigashira', 'Ardra', 'Punarvasu', 'Pushya', 'Ashlesha', 'Magha', 'Purva Phalguni', 'Uttara Phalguni', 'Hasta', 'Chitra', 'Swati', 'Vishakha', 'Anuradha', 'Jyeshtha', 'Mula', 'Purva Ashadha', 'Uttara Ashadha', 'Shravana', 'Dhanishta', 'Shatabhisha', 'Purva Bhadrapada', 'Uttara Bhadrapada', 'Revati'];

        // Planet Attributes from PDF
        const planetDetails = {
            'Sun': 'Focus, Calmness',
            'Moon': 'Subconscious, Emotional Intelligence',
            'Mars': 'Actions, Strength',
            'Mercury': 'Speech, Information, Knowledge',
            'Jupiter': 'Mentor, Authority, Core Competency',
            'Venus': 'Beauty, Meticulous',
            'Saturn': 'Strategy, Structure, Investments',
            'Rahu': 'Leading, Attention',
            'Ketu': 'Deliverable'
        };

        // House Attributes from PDF
        const houseDetails = {
            'H1': 'I Self, Personality',
            'H2': 'II Money, Family',
            'H3': 'III Performance, Presentation',
            'H4': 'IV Learnings, Home, Solution',
            'H5': 'V Hobbies, Magic, Mystic',
            'H6': 'VI Service',
            'H7': 'VII Public, Interaction',
            'H8': 'VIII Pain, Hidden',
            'H9': 'IX Fortune, Dharma',
            'H10': 'X Karma, Growth',
            'H11': 'XI Gains, Fulfillment',
            'H12': 'XII Spending'
        };

        const hDiv = document.getElementById('inputs-houses');
        houses.forEach(h => { hDiv.innerHTML += `<div class="input-group"><label>${h}</label><br><input type="number" id="${h}" placeholder="0-360"></div>`; });

        const pDiv = document.getElementById('inputs-planets');
        planets.forEach(p => { pDiv.innerHTML += `<div class="input-group"><label>${p}</label><br><input type="number" id="${p}" placeholder="0-360"></div>`; });

        function generateReport() {
            document.getElementById('input-screen').style.display = 'none';
            document.getElementById('report-screen').style.display = 'block';
            
            const basicTbody = document.querySelector('#basic-table tbody');
            const nakTbody = document.querySelector('#nakshatra-table tbody');
            basicTbody.innerHTML = ''; nakTbody.innerHTML = '';
            
            const allData = [];
            const rashiNakshatraMap = {};

            [...houses, ...planets].forEach(name => {
                let val = document.getElementById(name).value;
                if (val !== "") {
                    let deg = parseFloat(val);
                    let type = houses.includes(name) ? 'House' : 'Planet';
                    
                    let rashiIndex = Math.floor(deg / 30);
                    let rashi = rashiNames[rashiIndex] || 'Unknown';
                    
                    let nakshatraIndex = Math.floor(deg / 13.3333);
                    let nakshatraName = nakshatraNames[nakshatraIndex] || 'Unknown';
                    
                    let pada = Math.floor((deg % 13.3333) / 3.3333) + 1;
                    let detailText = type === 'House' ? houseDetails[name] : planetDetails[name];
                    
                    allData.push({ name, deg, type, detailText });
                    
                    // Rashi & Nakshatra Grouping
                    let groupKey = `${rashi}_${nakshatraName}`;
                    if(!rashiNakshatraMap[groupKey]) {
                        rashiNakshatraMap[groupKey] = { rashi: rashi, nakshatra: nakshatraName, occupants: [] };
                    }
                    
                    let fontColor = type === 'House' ? 'blue' : 'red';
                    rashiNakshatraMap[groupKey].occupants.push(`<span style="color:${fontColor}; font-weight:bold;">${name} (Pada ${pada})</span>`);
                    
                    basicTbody.innerHTML += `<tr><td><b>${name}</b></td><td>${deg}°</td><td>${type}</td><td>${pada}</td></tr>`;
                }
            });

            // Populate Nakshatra Table
            for (const key in rashiNakshatraMap) {
                let item = rashiNakshatraMap[key];
                nakTbody.innerHTML += `<tr><td><b>${item.rashi}</b></td><td><b>${item.nakshatra}</b></td><td>${item.occupants.join(', ')}</td></tr>`;
            }
            
            drawChakra(allData);
        }

        function drawChakra(data) {
            const canvas = document.getElementById('chakraCanvas');
            const ctx = canvas.getContext('2d');
            
            ctx.fillStyle = 'white';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            const img = new Image();
            img.src = 'chakra1.png'; // Make sure the image is named exactly this in GitHub
            
            img.onload = () => {
                ctx.drawImage(img, 200, 200, canvas.width - 400, canvas.height - 400);
                
                const centerX = canvas.width / 2;
                const centerY = canvas.height / 2;
                const lineRadius = (canvas.width / 2) - 150; 
                
                data.forEach(item => {
                    let radians = (item.deg - 90) * (Math.PI / 180);
                    let destX = centerX + lineRadius * Math.cos(radians);
                    let destY = centerY + lineRadius * Math.sin(radians);
                    
                    ctx.lineWidth = 5;
                    ctx.strokeStyle = item.type === 'House' ? '#0000FF' : '#FF0000'; 
                    ctx.beginPath();
                    ctx.moveTo(centerX, centerY);
                    ctx.lineTo(destX, destY);
                    ctx.stroke();

                    let textRadius = lineRadius + 70;
                    let textX = centerX + textRadius * Math.cos(radians);
                    let textY = centerY + textRadius * Math.sin(radians);
                    
                    ctx.fillStyle = item.type === 'House' ? '#0000FF' : '#FF0000';
                    ctx.textAlign = 'center';
                    ctx.textBaseline = 'middle';
                    
                    // Draw Planet/House Name
                    ctx.font = 'bold 36px Arial'; 
                    ctx.fillText(item.name, textX, textY - 15);
                    
                    // Draw PDF Specific Attributes
                    ctx.font = 'bold 22px Arial'; 
                    ctx.fillText(item.detailText, textX, textY + 20);
                });
            };
        }

        function downloadPDF() {
            const element = document.getElementById('pdf-content');
            var opt = {
                margin:       5,
                filename:     'Ghan-Chakra-Final-Report.pdf',
                image:        { type: 'jpeg', quality: 1.0 },
                html2canvas:  { scale: 2, useCORS: true }, 
                jsPDF:        { unit: 'mm', format: 'a4', orientation: 'portrait' },
                pagebreak:    { mode: 'css', before: '#page2' }
            };
            html2pdf().set(opt).from(element).save();
        }
    </script>
</body>
</html>
